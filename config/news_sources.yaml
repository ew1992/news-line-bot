# ニュースソース設定
# カテゴリやソースを追加・変更する場合はこのファイルを編集してください

# 取得するニュース数
max_articles: 5

# カテゴリ設定
categories:
  - name: "生成AI"
    enabled: true
    sources:
      - url: "https://rss.itmedia.co.jp/rss/2.0/aiplus.xml"
        name: "ITmedia AI＋ - 生成AI"
        schedule: "weekday"
      - url: "https://news.google.com/rss/search?q=%E7%94%9F%E6%88%90AI&hl=ja&gl=JP&ceid=JP:ja"
        name: "Google News - 生成AI"
        schedule: "weekend"

# schedule設定:
#   weekday: 平日（月〜金）のみ使用
#   weekend: 土日のみ使用
#   未設定: 常に使用
